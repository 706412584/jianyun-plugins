name: 打包并发布

on:
  push:
    branches: [master]
    paths:
      - "plugins/**"
      - "tools/**"
      - ".github/workflows/build-index.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # 两次推送同时跑会各自算一遍 sha256 并互相覆盖 index.json
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要提交更新后的 index.json
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 打包 + 生成索引
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # index.json 里可能已经有条目、但对应的 Release 资产并不存在
          # （首次提交 index 时就会这样）。逐条核对，缺资产或**哈希对不上**的用 --force 重建。
          #
          # 为什么必须比哈希：只比文件名的话，「打包逻辑变了、index 重算了哈希，但资产还是
          # 上一次上传的」这种情况查不出来——索引与资产长期不一致，而用户下载后校验必然失败
          # （真机踩到过：1611 字节的旧资产配 1616 字节的新哈希）。GitHub 的资产元数据里
          # 带 digest（sha256:…），直接拿来与 index 里的 sha256 比。
          FORCE=""
          python - <<'PY' > /tmp/force-ids.txt
          import json, os, subprocess, sys
          if not os.path.isfile("index.json"):
              sys.exit(0)
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          for p in json.load(open("index.json", encoding="utf-8")).get("plugins", []):
              tag = f"plugin/{p['id']}-{p['version']}"
              r = subprocess.run(
                  ["gh", "release", "view", tag, "-R", repo, "--json", "assets"],
                  capture_output=True, text=True,
              )
              if r.returncode != 0:
                  print(p["id"])
                  continue
              try:
                  assets = json.loads(r.stdout)["assets"]
              except Exception:
                  assets = []
              expected = os.path.basename(p.get("downloadUrl", ""))
              match = next((a for a in assets if a.get("name") == expected), None)
              if match is None:
                  print(p["id"])
                  continue
              want = (p.get("sha256") or "").lower()
              got = (match.get("digest") or "").lower().removeprefix("sha256:")
              # digest 为空说明这个 gh 版本/接口没给，退回只比文件名
              if want and got and want != got:
                  print(p["id"])
          PY
          while IFS= read -r id; do
            [ -n "$id" ] && FORCE="$FORCE --force --only $id"
          done < /tmp/force-ids.txt
          echo "强制重建：${FORCE:-（无）}"

          python tools/build_index.py \
            --base-url "https://github.com/${{ github.repository }}/releases/download" \
            --out dist $FORCE
          echo "uploads<<EOF" >> "$GITHUB_OUTPUT"
          cat dist/upload-list.txt 2>/dev/null >> "$GITHUB_OUTPUT" || true
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: 上传 Release 资产
        if: steps.build.outputs.uploads != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # upload-list.txt 每行是「本地路径<TAB>tag」。同名 tag 复用同一个 Release，
          # 这样同一插件的多个版本会归到同一页面，便于用户查看历史。
          while IFS=$'\t' read -r pkg tag; do
            [ -z "$pkg" ] && continue
            echo "── $tag ← $pkg"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "$pkg" --clobber
            else
              gh release create "$tag" "$pkg" \
                --title "$(basename "$tag")" \
                --notes "自动发布：$(basename "$pkg")"
            fi
          done < dist/upload-list.txt

      - name: 提交 index.json
        run: |
          if git diff --quiet -- index.json; then
            echo "index.json 无变化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "chore(index): 更新插件索引 [skip ci]"
          git push
