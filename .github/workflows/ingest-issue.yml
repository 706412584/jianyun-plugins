name: 处理插件投稿

# 不会用 Git 的作者通过 Issue 表单投稿，这里自动下载附件、校验、发布。
on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write
  # 社区投稿走 PR：需要创建/更新 pull request
  pull-requests: write

concurrency:
  group: ingest-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  ingest:
    # 只处理带 submission 标签的表单投稿
    if: contains(github.event.issue.labels.*.name, 'plugin-submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 从 Issue 正文提取附件链接
        id: extract
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          # GitHub 把拖入的附件渲染成 markdown 链接，指向 github.com/user-attachments/assets/<uuid>
          URL=$(printf '%s' "$BODY" | grep -oE 'https://github\.com/user-attachments/assets/[A-Za-z0-9-]+' | head -n1 || true)
          if [ -z "$URL" ]; then
            echo "found=" >> "$GITHUB_OUTPUT"
            echo "未在正文里找到附件链接（应把 .zip 文件拖进表单的插件包字段）" > /tmp/reason.txt
          else
            echo "found=1" >> "$GITHUB_OUTPUT"
            echo "url=$URL" >> "$GITHUB_OUTPUT"
            echo "找到附件：$URL"
          fi

      - name: 下载附件
        id: download
        if: steps.extract.outputs.found == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/incoming
          # user-attachments 需要跟随重定向，且公开仓库的附件可匿名下载；
          # 带上 token 更稳（避免限流）。
          #
          # 失败时**不能让 job 直接挂掉**：GitHub 的步骤默认隐含 `if: success()`，
          # 一旦这里失败，后面所有步骤（包括「回复失败」）都会被跳过，
          # 投稿者提交完就再也收不到任何反馈，只能干等。
          if curl -fL --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -o /tmp/incoming/package.zip "${{ steps.extract.outputs.url }}"; then
            echo "downloaded=1" >> "$GITHUB_OUTPUT"
            echo "下载完成：$(stat -c %s /tmp/incoming/package.zip) 字节"
          else
            echo "downloaded=" >> "$GITHUB_OUTPUT"
            echo "附件下载失败：链接可能已过期，或附件被删除。请重新拖入插件包。" > /tmp/reason.txt
          fi

      - name: 校验
        id: validate
        if: steps.download.outputs.downloaded == '1'
        run: |
          if python tools/validate.py --zip /tmp/incoming/package.zip > /tmp/validate.log 2>&1; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "ok=" >> "$GITHUB_OUTPUT"
          fi
          cat /tmp/validate.log

      - name: 判定信任级别
        id: trust
        if: steps.validate.outputs.ok == '1'
        env:
          AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          # publisher 是投稿者在 manifest 里**自己填的字符串**，不是身份证明：
          # 任何人写 publisher=维护者用户名 都能拿到「已验证」徽章。
          # 真正的身份只有 GitHub 给的这个 issue 作者登录名。
          # 因此：只有「publisher 在受信列表里，且 issue 作者就是这个 publisher」
          # 才走自动发布 + verified；其余一律 community，转成 PR 等维护者点合并。
          python - <<'PY' > /tmp/trust.txt
          import json, os, zipfile
          with zipfile.ZipFile("/tmp/incoming/package.zip") as zf:
              m = json.loads(zf.read("manifest.json").decode("utf-8"))
          publisher = str(m.get("publisher", "")).strip().lower()
          author = os.environ.get("AUTHOR", "").strip().lower()
          trusted = set()
          try:
              with open(".github/trusted-publishers.txt", encoding="utf-8") as f:
                  trusted = {
                      line.strip().lower() for line in f
                      if line.strip() and not line.strip().startswith("#")
                  }
          except FileNotFoundError:
              pass
          if publisher and publisher == author and publisher in trusted:
              print("verified")
          else:
              print("community")
          PY
          TRUST=$(cat /tmp/trust.txt)
          echo "level=$TRUST" >> "$GITHUB_OUTPUT"
          echo "信任级别：$TRUST（投稿者 $AUTHOR）"

      - name: 展开投稿包
        id: unpack
        if: steps.validate.outputs.ok == '1'
        run: |
          # 附件扩展名是 .zip（GitHub 不接受 .plugin），这里还原成源目录，
          # 后续 build_index 会重新打包（保证权限位正确）
          python - <<'PY'
          import json, os, shutil, zipfile
          src = "/tmp/incoming/package.zip"
          with zipfile.ZipFile(src) as zf:
              manifest = json.loads(zf.read("manifest.json").decode("utf-8"))
          pid = manifest["id"]
          dst_dir = os.path.join("plugins", pid)
          shutil.rmtree(dst_dir, ignore_errors=True)
          os.makedirs(dst_dir, exist_ok=True)
          with zipfile.ZipFile(src) as zf:
              for info in zf.infolist():
                  if info.is_dir():
                      continue
                  if info.filename != "manifest.json" and not info.filename.startswith("payload/"):
                      continue
                  out = os.path.join(dst_dir, info.filename)
                  os.makedirs(os.path.dirname(out), exist_ok=True)
                  with zf.open(info) as r, open(out, "wb") as w:
                      shutil.copyfileobj(r, w)
          print(f"已展开到 {dst_dir}")
          with open("/tmp/pid.txt", "w") as f:
              f.write(pid)
          PY
          echo "pid=$(cat /tmp/pid.txt)" >> "$GITHUB_OUTPUT"

      - name: 直接发布（受信作者）
        id: publish
        if: steps.validate.outputs.ok == '1' && steps.trust.outputs.level == 'verified'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PID="${{ steps.unpack.outputs.pid }}"
          # 用 auto（不是强制 verified）：publisher 命中的只说明「作者可信」，
          # 这个插件本身有没有被签字，仍由 verified-plugins.txt 决定。
          python tools/build_index.py \
            --base-url "https://github.com/${{ github.repository }}/releases/download" \
            --out dist --only "$PID" --trust auto | tee /tmp/build.log

          if [ -s dist/upload-list.txt ]; then
            while IFS=$'\t' read -r pkg tag; do
              [ -z "$pkg" ] && continue
              if gh release view "$tag" >/dev/null 2>&1; then
                gh release upload "$tag" "$pkg" --clobber
              else
                gh release create "$tag" "$pkg" --title "$(basename "$tag")" --notes "来自 Issue #${{ github.event.issue.number }}"
              fi
            done < dist/upload-list.txt
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins index.json
          git diff --cached --quiet || git commit -m "feat(plugins): 来自 Issue #${{ github.event.issue.number }} 的投稿 [skip ci]"
          git push

      - name: 开 PR 待人工合并（社区投稿）
        id: propose
        # 用 == 'community' 而不是 != 'verified'：trust 步骤失败时 level 是空串，
        # 而 `'' != 'verified'` 为真——会把没判定过的投稿当成社区投稿推上去。
        if: steps.validate.outputs.ok == '1' && steps.trust.outputs.level == 'community'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 社区投稿**不直接进 master**：自动校验只能挡住已知的危险模式，
          # 挡不住「把容器里的凭据发到某个看起来正常的域名」。发布权必须经过人。
          BRANCH="submission/issue-${{ github.event.issue.number }}"
          # 受信作者走的是另一条路（已直接 push 到 master），这里不能再 checkout
          # 一个与 master 同名的分支去推，否则会把 master 的内容推到新分支上
          git fetch origin master
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add plugins
          # 用户原样重提（Issue edited 但包没变）时没有变更可提交；
          # 裸 `git commit` 会以非零退出让整个步骤失败，后面的开 PR 就没了。
          git diff --cached --quiet \
            || git commit -m "feat(plugins): 来自 Issue #${{ github.event.issue.number }} 的投稿"
          git push origin "$BRANCH" --force

          # 用户改稿后重跑（Issue edited）时 PR 已经存在：直接复用，不要重复开
          EXISTING=$(gh pr list --head "$BRANCH" --json url --jq '.[0].url' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            echo "pr=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "已有 PR：$EXISTING"
            exit 0
          fi

          PR_URL=$(gh pr create \
            --head "$BRANCH" \
            --title "插件投稿：${{ steps.unpack.outputs.pid }}（Issue #${{ github.event.issue.number }}）" \
            --body "来自 Issue #${{ github.event.issue.number }} 的社区投稿，自动校验已通过。

          **合并前请人工看一眼** \`plugins/${{ steps.unpack.outputs.pid }}/manifest.json\` 里的 installSteps：
          插件在用户容器里以 root 执行，自动校验挡不住「把凭据发到外部」这类行为。

          合并后 \`build-index.yml\` 会自动打包、发 Release 并更新索引（信任级别为 community）。")

          echo "pr=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: 回复（已发布）
        if: steps.validate.outputs.ok == '1' && steps.trust.outputs.level == 'verified'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "✅ 已发布：\`${{ steps.unpack.outputs.pid }}\`
          App 内「插件 → 市场」下拉刷新即可看到。"
          gh issue close "${{ github.event.issue.number }}"

      - name: 回复（待人工合并）
        if: steps.validate.outputs.ok == '1' && steps.trust.outputs.level == 'community'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "✅ 自动校验已通过，已创建 PR 等待人工合并：
          ${{ steps.propose.outputs.pr }}

          合并后 App 内「插件 → 市场」刷新即可看到（标记为「社区」）。
          社区投稿未经人工审核内容，合并前维护者会看一眼安装命令。"
          gh issue close "${{ github.event.issue.number }}"

      - name: 回复失败
        # 必须用 always()：validate 之前任何一步失败（比如附件下载失败）都会让
        # 默认的 if: success() 全部短路，投稿者就收不到失败原因了。
        #
        # 条件写成「没成功发布」而不是「validate 没通过」：信任判定/开 PR 这些
        # 后续步骤失败时 validate.outputs.ok 仍是 1，投稿者同样会收不到任何反馈。
        if: always() && !(steps.publish.outcome == 'success' || steps.propose.outcome == 'success')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 按阶段取原因。不能一律读 validate.log：校验通过后若在开 PR 阶段失败，
          # 那份日志写的是「通过」，会给出与事实相反的说明。
          if [ -f /tmp/reason.txt ]; then
            REASON=$(cat /tmp/reason.txt)
            HINT="修改后编辑本 Issue（重新拖入文件）会自动重试。"
          elif [ "${{ steps.validate.outputs.ok }}" != "1" ]; then
            REASON=$(cat /tmp/validate.log 2>/dev/null || echo "未知原因")
            HINT="修改后编辑本 Issue（重新拖入文件）会自动重试；也可以改用 PR 方式提交。"
          else
            REASON="自动校验已通过，但后续发布步骤失败（信任判定 / 创建 PR / 推送分支）。
          这通常是仓库配置或权限问题，不是你的插件有问题——请稍后重试，或直接提 PR。"
            HINT="维护者可在 Actions 页面查看失败日志。"
          fi
          gh issue comment "${{ github.event.issue.number }}" --body "❌ 投稿未通过：

          \`\`\`
          $REASON
          \`\`\`

          $HINT"
          gh issue edit "${{ github.event.issue.number }}" --add-label "needs-fix" || true
